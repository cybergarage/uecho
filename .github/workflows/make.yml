name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: setup
      run: |
        sudo apt update
        sudo apt install -y automake libboost-all-dev
    - name: check database generators
      run: src/uecho/std/test/check_generators.sh
    - name: bootstrap 
      run: ./bootstrap
    - name: configure
      run: ./configure --enable-coverage --enable-test --enable-examples
    - name: make
      run: make -j 20
    - name: make check
      run: |
        make check -j 20 \
          UECHO_TEST_ALLOCATOR_CPPFLAGS=-DUECHO_TEST_ALLOCATOR_FAILURES \
          UECHO_TEST_ALLOCATOR_LDFLAGS='-Wl,--wrap=malloc,--wrap=calloc,--wrap=realloc' \
          || { cat test/unix/test-suite.log; exit 1; }
    - name: generate coverage
      run: |
        # Generate gcov files for all source directories
        cd src/uecho
        gcov libuecho_a-*.o
        cd frame && gcov libuecho_a-*.o || true
        cd ../net && gcov libuecho_a-*.o || true
        cd ../util && gcov libuecho_a-*.o || true
        cd ../std && gcov libuecho_a-*.o || true
        cd ../../
        # List generated coverage files for debugging
        find . -name "*.gcov" | wc -l
        echo "Coverage files generated successfully"

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: cybergarage/uecho
        files: './src/**/*.gcov'
        directory: './src'
